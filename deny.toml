# cargo-deny policy: `cargo deny check` (run in CI and via `make deny`).

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  # RUSTSEC-2023-0071, Marvin attack (timing side channel in RSA private key
  # operations). No fixed `rsa` release exists; jsonwebtoken's rust_crypto
  # backend pulls it in for RS256 signing. Exposure here is limited: the only
  # private-key operation is signing a SHA-256 digest of claims the server
  # itself composed, for callers who already hold a valid grant, and the
  # crate applies RNG blinding on that path. Re-evaluate when
  # https://github.com/RustCrypto/RSA/issues/626 closes or when switching the
  # JWT backend to aws-lc-rs.
  { id = "RUSTSEC-2023-0071", reason = "no fix available; signing-only use, see comment" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
