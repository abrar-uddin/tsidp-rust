name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege by default; the image job raises what it needs.
permissions:
  contents: read

# Actions are pinned to commit SHAs (tag in the comment) so a repointed tag
# cannot change what runs here.
jobs:
  rust:
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Advisories (policy in deny.toml), licenses, duplicate crates, sources.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint < Dockerfile

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
      - run: helm lint charts/tsidp
      - run: helm template tsidp charts/tsidp --set tailscale.authKeySecret=x > /tmp/helm.yaml
      - run: kubectl kustomize deploy/kubernetes/base > /tmp/base.yaml
      - run: kubectl kustomize deploy/kubernetes/overlays/pvc > /tmp/pvc.yaml
      - name: kube-linter
        run: |
          docker run --rm -v "$PWD:/src" -v /tmp:/tmp stackrox/kube-linter lint \
            --config /src/.kube-linter.yaml /tmp/helm.yaml /tmp/base.yaml /tmp/pvc.yaml

  image:
    # Branch builds only (:main, :sha-...). Tagged releases are built by
    # release.yaml, which also publishes :X.Y.Z and :latest.
    if: github.ref_type != 'tag'
    needs: [rust, supply-chain, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
