name: release
# Pushing a tag vX.Y.Z (see scripts/release.sh) produces:
#   * the image ghcr.io/<owner>/tsidp-rust:X.Y.Z and :latest (amd64, arm64)
#   * static binaries tsidp-server-vX.Y.Z-linux-{amd64,arm64}.tar.gz + SHA256SUMS
#   * the Helm chart, as a tarball on the release and as an OCI chart at
#     oci://ghcr.io/<owner>/charts/tsidp
#   * a GitHub Release whose body is the CHANGELOG section for X.Y.Z
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: v
        name: tag matches Cargo.toml, Chart.yaml and CHANGELOG
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -1)
          chart_v=$(sed -nE 's/^appVersion: "?([^"]+)"?$/\1/p' charts/tsidp/Chart.yaml)
          chart_c=$(sed -nE 's/^version: (.+)$/\1/p' charts/tsidp/Chart.yaml)
          for pair in "Cargo.toml=$cargo_v" "Chart.appVersion=$chart_v" "Chart.version=$chart_c"; do
            [ "${pair#*=}" = "$tag" ] || { echo "tag $tag does not match ${pair%%=*} (${pair#*=})" >&2; exit 1; }
          done
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $tag" >&2; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: rustup component add clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Same builder stage as the image (cross-compiled on amd64, no QEMU),
      # exporting only the static binary.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          target: binary
          outputs: type=local,dest=out
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
      - name: package
        run: |
          set -eu
          v="${{ needs.verify.outputs.version }}"
          stage="tsidp-server-v$v-linux-${{ matrix.arch }}"
          mkdir -p "stage/$stage" dist
          cp out/tsidp-server LICENSE README.md CHANGELOG.md "stage/$stage/"
          chmod 0755 "stage/$stage/tsidp-server"
          tar -C stage -czf "dist/$stage.tar.gz" "$stage"
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  chart:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: package and push OCI chart
        run: |
          set -eu
          v="${{ needs.verify.outputs.version }}"
          helm lint charts/tsidp
          mkdir -p dist
          helm package charts/tsidp --version "$v" --app-version "$v" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/tsidp-$v.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chart
          path: dist/*.tgz
          if-no-files-found: error

  release:
    needs: [verify, image, binaries, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # actions/download-artifact@v4 failed repeatedly ("download failed after
      # 5 retries") on this run's artifacts; the gh CLI uses the same API and
      # is already on the runner.
      - name: download build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts
          mkdir -p dist
          find artifacts -type f -exec mv -t dist/ {} +
          ls -l dist
      - name: checksums and notes
        run: |
          set -eu
          v="${{ needs.verify.outputs.version }}"
          (cd dist && sha256sum *.tar.gz *.tgz > SHA256SUMS)
          # CHANGELOG section for this version = release body.
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ### Artifacts
          | artifact | reference |
          |---|---|
          | image | \`${{ env.IMAGE }}:$v\` (also \`:latest\`), digest \`${{ needs.image.outputs.digest }}\`, linux/amd64 + linux/arm64 |
          | Helm chart | \`helm install tsidp oci://ghcr.io/${{ github.repository_owner }}/charts/tsidp --version $v\` |
          | binaries | \`tsidp-server-v$v-linux-{amd64,arm64}.tar.gz\`, static musl, verify with \`SHA256SUMS\` |
          EOF
          cat notes.md
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "tsidp-rust $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            dist/*
