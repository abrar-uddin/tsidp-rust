apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tsidp
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - configmap-serve.yaml
  - statefulset.yaml
  - service.yaml
  - networkpolicy.yaml
# Create the auth key secret out of band, e.g.:
#   kubectl -n tsidp create secret generic tsidp-authkey --from-literal=TS_AUTHKEY=tskey-auth-...
# or with SealedSecrets / External Secrets / 1Password operator.
