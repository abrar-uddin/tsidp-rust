apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tsidp.fullname" . }}
  labels:
    {{- include "tsidp.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tsidp.fullname" . }}
  labels:
    {{- include "tsidp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- if .Values.tailscale.kubeSecret }}
      - {{ .Values.tailscale.kubeSecret }}
      {{- end }}
      - {{ .Values.tsidp.stateSecret }}
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tsidp.fullname" . }}
  labels:
    {{- include "tsidp.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tsidp.fullname" . }}
roleRef:
  kind: Role
  name: {{ include "tsidp.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
