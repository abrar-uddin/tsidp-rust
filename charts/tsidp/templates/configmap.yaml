apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tsidp.fullname" . }}-serve
  labels:
    {{- include "tsidp.labels" . | nindent 4 }}
data:
  serve.json: |
    {
      "TCP": { "443": { "HTTPS": true } },
      "Web": {
        "${TS_CERT_DOMAIN}:443": {
          "Handlers": { "/": { "Proxy": "http://127.0.0.1:8443" } }
        }
      }{{- if .Values.tailscale.funnel }},
      "AllowFunnel": { "${TS_CERT_DOMAIN}:443": true }{{- end }}
    }
